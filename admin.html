<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Panel - VPCDR</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet"><style>*{font-family:'Vazirmatn',sans-serif}body{margin:0;background:#F5F1E8;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}.card{background:white;padding:30px;border-radius:20px;max-width:480px;width:100%;border-top:5px solid #B78C2E;box-shadow:0 10px 30px rgba(0,0,0,0.1)}h1{color:#0F4C3C;text-align:center;font-size:22px}input{width:100%;padding:12px;border:1px solid #E8DDC0;border-radius:12px;margin:12px 0}button{background:#B78C2E;color:white;border:none;padding:12px;border-radius:12px;width:100%;font-weight:700;cursor:pointer}button:hover{background:#A67C24}a{display:block;text-align:center;margin-top:12px;color:#0F4C3C;text-decoration:none;font-size:14px}</style></head><body><div class="card"><h1>پنل مدیریت لایسنس VPCDR</h1><input type="password" id="p" placeholder="رمز عبور"><button onclick="if(document.getElementById('p').value==='1234Vpcdr!'){location.href='index.html?admin=1'}else{alert('رمز اشتباه')}">ورود به پنل</button><a href="index.html">بازگشت به سایت</a><a href="index.html?admin=1">ورود مستقیم ?admin=1</a></div></body></html>
